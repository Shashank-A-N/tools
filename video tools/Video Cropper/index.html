<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Video - Professional Cropper</title>

    <!-- Tailwind (for utility classes alongside custom CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts / Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom Styles -->
    <link rel="stylesheet" href="../../styles.css"> <!-- Shared styles -->
    <link rel="stylesheet" href="style.css"> <!-- Specific App styles -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif']
                    },
                    colors: {
                        cyber: { primary: '#8b5cf6' }
                    }
                }
            }
        }
    </script>

    <!-- ShadowTools Unified Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>

    <style id="shadow-toggle-light">
        .light-mode .theme-toggle-btn {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #f59e0b !important;
        }
    </style>
</head>

<body class="text-white selection:bg-violet-500 selection:text-white">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <!-- DEBUG LOG REMOVED -->

    <div id="bg-3d-container"></div>

    <!-- LANDING VIEW (Fixed Overlay) -->
    <div id="landing-view"
        class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-8 bg-slate-900/95 backdrop-blur-xl transition-all duration-500">
        <div class="text-center space-y-8 animate-fade-in-up">
            <div class="inline-block relative">
                <div class="absolute inset-0 bg-violet-500/20 blur-3xl rounded-full animate-pulse"></div>
                <i
                    class="fas fa-crop-alt text-8xl text-transparent bg-clip-text bg-gradient-to-br from-violet-400 to-indigo-600 relative z-10 filter drop-shadow-lg"></i>
            </div>

            <h1 class="text-4xl md:text-6xl font-orbitron font-bold tracking-widest text-white">SHADOW<span
                    class="text-gradient">CROP</span></h1>
            <p class="text-slate-400 text-lg max-w-md mx-auto font-sans tracking-wide">
                Professional Client-Side Video Cropping.<br>
                Lossless Audio. 60FPS Filters. Privacy Focused.
            </p>

            <label
                class="group relative inline-flex items-center justify-center px-16 py-6 overflow-hidden font-bold text-white transition-all duration-300 bg-violet-600 rounded-2xl cursor-pointer hover:bg-violet-700 hover:scale-105 shadow-neon">
                <span
                    class="absolute inset-0 w-full h-full -mt-1 rounded-lg opacity-30 bg-gradient-to-b from-transparent via-transparent to-black"></span>
                <span class="relative flex items-center gap-3 text-xl font-orbitron tracking-widest">
                    <i class="fas fa-cloud-upload-alt"></i> UPLOAD VIDEO
                </span>
                <input type="file" id="landing-fileInput" accept="video/*" class="hidden">
            </label>

            <div class="flex gap-8 justify-center text-slate-500 text-xs font-mono uppercase tracking-widest mt-8">
                <span class="flex items-center gap-2"><i class="fas fa-check text-green-500"></i> No Server
                    Upload</span>
                <span class="flex items-center gap-2"><i class="fas fa-check text-green-500"></i> GPU
                    Acceleration</span>
                <span class="flex items-center gap-2"><i class="fas fa-check text-green-500"></i> WA/IG Ready</span>
            </div>
        </div>
    </div>

    <!-- EDITOR VIEW (App Container) -->
    <!-- Initially hidden/disabled via classes -->
    <div id="editor-view" class="app-container relative opacity-0 pointer-events-none transition-opacity duration-500">
        <!-- Navbar -->
        <nav class="navbar">
            <div class="flex items-center gap-4">
                <button id="btn-back-home"
                    class="flex items-center gap-2 text-slate-400 hover:text-white transition-colors">
                    <i class="fas fa-chevron-left"></i>
                    <span class="font-orbitron font-bold text-sm hidden sm:inline">HOME</span>
                </button>
                <div class="h-6 w-px bg-white/10 mx-2"></div>
                <div class="flex items-center gap-2">
                    <i class="fas fa-crop-alt text-violet-500"></i>
                    <h1 class="text-lg md:text-xl font-orbitron font-bold tracking-widest">SHADOW<span
                            class="text-gradient">CROP</span></h1>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="recording-indicator" id="recordingIndicator" title="Recording..."></div>
                <button id="btn-export" class="btn btn-primary"
                    onclick="if(window.app) window.app.handleExport(); else console.error('App not ready')" disabled>
                    <i class="fas fa-download"></i> <span class="hidden sm:inline ml-2">EXPORT</span>
                </button>
            </div>
        </nav>

        <!-- Left Sidebar: Controls -->
        <aside class="sidebar-left panel" id="panel-controls">
            <div class="p-4 border-b border-white/5">
                <h2 class="font-orbitron text-sm text-slate-400 uppercase tracking-widest">Controls</h2>
            </div>

            <div class="p-4 flex flex-col gap-6">
                <!-- Change Source -->
                <div class="input-group">
                    <label class="label">Change Source</label>
                    <label class="btn justify-center text-xs">
                        <i class="fas fa-folder-open"></i> Browse
                        <input type="file" id="fileInput" accept="video/*" class="hidden">
                    </label>
                </div>

                <!-- Aspect Ratio -->
                <div class="input-group">
                    <label class="label">Aspect Ratio</label>
                    <div class="grid grid-cols-4 gap-2">
                        <button class="btn justify-center text-xs" data-ratio="1.777">16:9</button>
                        <button class="btn justify-center text-xs" data-ratio="1.333">4:3</button>
                        <button class="btn justify-center text-xs" data-ratio="1">1:1</button>
                        <button class="btn justify-center text-xs" data-ratio="0.5625">9:16</button>
                    </div>
                </div>

                <!-- Manual Crop Inputs -->
                <div class="input-group">
                    <label class="label">Geometry</label>
                    <div class="grid grid-cols-2 gap-2">
                        <div class="relative">
                            <span class="absolute left-2 top-1.5 text-xs text-slate-500">X</span>
                            <input type="number" id="input-x" class="input w-full pl-6 text-sm">
                        </div>
                        <div class="relative">
                            <span class="absolute left-2 top-1.5 text-xs text-slate-500">Y</span>
                            <input type="number" id="input-y" class="input w-full pl-6 text-sm">
                        </div>
                        <div class="relative">
                            <span class="absolute left-2 top-1.5 text-xs text-slate-500">W</span>
                            <input type="number" id="input-w" class="input w-full pl-6 text-sm">
                        </div>
                        <div class="relative">
                            <span class="absolute left-2 top-1.5 text-xs text-slate-500">H</span>
                            <input type="number" id="input-h" class="input w-full pl-6 text-sm">
                        </div>
                    </div>
                </div>

                <!-- History -->
                <div class="flex gap-2 mt-auto">
                    <button id="btn-undo" class="btn flex-1 justify-center" disabled>
                        <i class="fas fa-undo"></i> Undo
                    </button>
                    <button id="btn-redo" class="btn flex-1 justify-center" disabled>
                        <i class="fas fa-redo"></i> Redo
                    </button>
                </div>
            </div>
        </aside>

        <!-- Center Stage -->
        <main class="stage" id="stage">
            <!-- Video & Canvas are injected here by JS -->

            <!-- Crop Overlay (Hidden initially) -->
            <div id="crop-overlay" class="hidden">
                <div class="crop-handle handle-nw" data-handle="nw"></div>
                <div class="crop-handle handle-n" data-handle="n"></div>
                <div class="crop-handle handle-ne" data-handle="ne"></div>
                <div class="crop-handle handle-w" data-handle="w"></div>
                <div class="crop-handle handle-e" data-handle="e"></div>
                <div class="crop-handle handle-sw" data-handle="sw"></div>
                <div class="crop-handle handle-s" data-handle="s"></div>
                <div class="crop-handle handle-se" data-handle="se"></div>

                <!-- Grid Lines -->
                <div class="grid-lines">
                    <div class="grid-line-x-1"></div>
                    <div class="grid-line-x-2"></div>
                    <div class="grid-line-y-1"></div>
                    <div class="grid-line-y-2"></div>
                </div>
            </div>
        </main>

        <!-- Right Sidebar: Filters & Metadata -->
        <aside class="sidebar-right panel" id="panel-filters">
            <div class="p-4 border-b border-white/5">
                <h2 class="font-orbitron text-sm text-slate-400 uppercase tracking-widest">Filters</h2>
            </div>

            <div class="p-4 flex flex-col gap-6">
                <!-- Presets -->
                <div class="input-group">
                    <label class="label">Presets</label>
                    <select id="preset-select" class="select w-full text-sm">
                        <option value="normal">Normal</option>
                        <option value="cinematic">Cinematic</option>
                        <option value="noir">Noir (B&W)</option>
                        <option value="vintage">Vintage</option>
                        <option value="cyberpunk">Cyberpunk</option>
                    </select>
                </div>

                <!-- Sliders -->
                <div class="slider-container">
                    <div class="flex justify-between mb-1">
                        <label class="label">Brightness</label>
                        <span class="text-xs text-slate-400" id="val-brightness">100%</span>
                    </div>
                    <input type="range" min="0" max="200" value="100" data-filter="brightness">
                </div>

                <div class="slider-container">
                    <div class="flex justify-between mb-1">
                        <label class="label">Contrast</label>
                        <span class="text-xs text-slate-400" id="val-contrast">100%</span>
                    </div>
                    <input type="range" min="0" max="200" value="100" data-filter="contrast">
                </div>

                <div class="slider-container">
                    <div class="flex justify-between mb-1">
                        <label class="label">Saturation</label>
                        <span class="text-xs text-slate-400" id="val-saturation">100%</span>
                    </div>
                    <input type="range" min="0" max="200" value="100" data-filter="saturation">
                </div>

                <div class="slider-container">
                    <div class="flex justify-between mb-1">
                        <label class="label">Hue Rotate</label>
                        <span class="text-xs text-slate-400" id="val-hue">0°</span>
                    </div>
                    <input type="range" min="0" max="360" value="0" data-filter="hue">
                </div>

                <!-- Stats / Metadata (Dynamic) -->
                <div id="metadata-panel"
                    class="mt-auto p-3 bg-black/20 rounded border border-white/5 text-xs text-slate-400 font-mono">
                    <div class="flex justify-between"><span>Size:</span> <span id="meta-size">-</span></div>
                    <div class="flex justify-between"><span>Res:</span> <span id="meta-res">-</span></div>
                    <div class="flex justify-between"><span>Dur:</span> <span id="meta-dur">-</span></div>
                </div>
            </div>
        </aside>

        <!-- Footer: Timeline -->
        <footer class="footer">
            <button id="btn-play-pause"
                class="btn text-xl w-12 h-12 justify-center rounded-full bg-white/5 hover:bg-violet-500/20">
                <i class="fas fa-play"></i>
            </button>

            <div class="flex-grow flex flex-col gap-1">
                <div class="text-xs text-slate-400 flex justify-between font-mono">
                    <span id="time-current">00:00</span>
                    <span id="time-total">00:00</span>
                </div>
                <input type="range" id="timeline" min="0" max="100" value="0"
                    class="w-full h-2 bg-slate-700 rounded-full appearance-none">
            </div>

            <div class="flex items-center gap-2">
                <i class="fas fa-volume-up text-xs text-slate-500"></i>
                <input type="range" id="volume" min="0" max="1" step="0.1" value="1" class="w-20">
            </div>
        </footer>
    </div>

    <!-- PREVIEW MODAL -->
    <div id="preview-modal"
        class="fixed inset-0 z-[200] flex items-center justify-center bg-black/90 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-white/10 rounded-2xl p-6 shadow-2xl max-w-4xl w-full flex flex-col gap-4 transform scale-95 transition-transform duration-300"
            id="preview-content">
            <div class="flex justify-between items-center text-slate-300 border-b border-white/5 pb-4">
                <h3 class="font-orbitron font-bold text-xl tracking-widest"><i
                        class="fas fa-check-circle text-green-500 mr-2"></i> EXPORT READY</h3>
                <button id="btn-close-preview" class="hover:text-white transition-colors"><i
                        class="fas fa-times text-xl"></i></button>
            </div>

            <div
                class="relative bg-black/50 rounded-lg overflow-hidden flex items-center justify-center aspect-video border border-white/5">
                <video id="preview-video" controls class="max-h-[60vh] w-full object-contain"></video>
            </div>

            <div class="flex justify-end gap-4 pt-2">
                <button id="btn-discard" class="btn text-slate-400 hover:text-white hover:bg-white/5">
                    <i class="fas fa-trash"></i> Discard
                </button>
                <button id="btn-save-disk" class="btn btn-primary px-8 py-3 text-lg">
                    <i class="fas fa-download"></i> SAVE VIDEO
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module" src="script.js"></script>
</body>

</html>
