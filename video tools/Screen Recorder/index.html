<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Video - Screen Recorder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="../../styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif']
                    },
                    colors: {
                        cyber: {
                            primary: '#ef4444', // Red for Recording
                            accent: '#3b82f6'
                        }
                    }
                }
            }
        }
    </script>

    <!-- ShadowTools Unified Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>

    <style id="shadow-toggle-light">
        .light-mode .theme-toggle-btn {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #f59e0b !important;
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col font-sans overflow-x-hidden bg-slate-900 text-white selection:bg-red-500 selection:text-white">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <!-- 3D Background -->
    <div id="bg-3d-container"></div>

    <!-- Navigation -->
    <nav
        class="sticky top-0 z-50 glass-effect border-b border-white/5 px-4 md:px-6 py-3 flex items-center justify-between backdrop-blur-md">
        <a href="../index.html" class="flex items-center gap-3 text-slate-300 hover:text-white transition-colors group">
            <div
                class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center border border-white/10 group-hover:border-red-500/50 transition-all">
                <i class="fas fa-chevron-left text-xs group-hover:-translate-x-0.5 transition-transform"></i>
            </div>
            <span class="font-orbitron font-bold tracking-wider hidden md:block">BACK</span>
        </a>

        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-red-500/20 flex items-center justify-center text-red-500">
                <i class="fas fa-desktop"></i>
            </div>
            <h1 class="text-lg md:text-xl font-orbitron font-bold tracking-widest text-white">SHADOW<span
                    class="text-red-500">REC</span></h1>
        </div>

        <div class="w-8"></div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 relative z-10 flex flex-col items-center gap-6">

        <!-- Preview Area -->
        <div
            class="w-full max-w-4xl aspect-video bg-black/50 rounded-2xl border border-white/10 shadow-2xl overflow-hidden relative group">
            <video id="preview" autoplay muted class="w-full h-full object-contain"></video>

            <!-- Overlay Message -->
            <div id="statusOverlay"
                class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 backdrop-blur-sm transition-opacity duration-300">
                <i class="fas fa-desktop text-6xl text-slate-600 mb-4"></i>
                <h3 class="text-xl font-orbitron text-slate-400">Ready to Capture</h3>
                <p class="text-slate-500 text-sm mt-2">Click "Start Recording" to choose a screen</p>
            </div>

            <!-- Recording Indicator -->
            <div id="recIndicator"
                class="absolute top-4 right-4 flex items-center gap-2 bg-red-500/90 text-white px-3 py-1 rounded-full text-xs font-bold tracking-wider opacity-0 transition-opacity">
                <div class="w-2 h-2 bg-white rounded-full animate-pulse"></div>
                REC <span id="timer">00:00</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-center gap-4 w-full max-w-md">
            <button id="startBtn" onclick="startRecording()"
                class="flex-1 py-4 bg-gradient-to-r from-red-600 to-red-500 hover:from-red-500 hover:to-red-400 rounded-xl font-bold tracking-wider shadow-lg shadow-red-900/20 transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2">
                <i class="fas fa-circle"></i> START RECORDING
            </button>

            <button id="stopBtn" onclick="stopRecording()" disabled
                class="flex-1 py-4 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl font-bold tracking-wider shadow-lg transition-all flex items-center justify-center gap-2">
                <i class="fas fa-square"></i> STOP
            </button>
        </div>

        <!-- Recorded List -->
        <div id="downloads" class="w-full max-w-4xl hidden">
            <div class="glass-header px-4 py-2 border-b border-white/5 bg-slate-900/40 rounded-t-xl">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-widest">Capture Gallery</span>
            </div>
            <div id="recordingsList" class="p-4 glass rounded-b-xl border border-white/5 flex flex-col gap-2">
            </div>
        </div>

    </main>

    <!-- Shared Script -->
    <script type="module" src="../../shared/bg-particles.js"></script>

    <script>
        let mediaRecorder;
        let recordedChunks = [];
        let startTime;
        let timerInterval;

        const preview = document.getElementById('preview');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusOverlay = document.getElementById('statusOverlay');
        const recIndicator = document.getElementById('recIndicator');
        const timerEl = document.getElementById('timer');
        const downloads = document.getElementById('downloads');
        const recordingsList = document.getElementById('recordingsList');

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({
                    video: { cursor: "always" },
                    audio: true
                });

                preview.srcObject = stream;
                statusOverlay.style.opacity = '0';
                statusOverlay.style.pointerEvents = 'none';

                mediaRecorder = new MediaRecorder(stream);

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        recordedChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = () => {
                    finalizeRecording();
                    stopTimer();

                    // Stop all tracks to release camera/screen
                    stream.getTracks().forEach(track => track.stop());
                    preview.srcObject = null;
                    statusOverlay.style.opacity = '1';
                };

                // Handle case where user stops via browser UI
                stream.getVideoTracks()[0].onended = () => {
                    if (mediaRecorder.state !== 'inactive') {
                        stopRecording();
                    }
                };

                mediaRecorder.start();
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden'); // Actually I used flex-1 so I should toggle states properly
                startBtn.disabled = true;
                stopBtn.disabled = false;
                startBtn.classList.add('opacity-50', 'cursor-not-allowed');

                recIndicator.style.opacity = '1';
                startTimer();

            } catch (err) {
                console.error("Error: " + err);
            }
        }

        function stopRecording() {
            mediaRecorder.stop();
            startBtn.disabled = false;
            stopBtn.disabled = true;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }

        function finalizeRecording() {
            const blob = new Blob(recordedChunks, {
                type: "video/webm"
            });
            const url = URL.createObjectURL(blob);

            downloads.classList.remove('hidden');

            const item = document.createElement('div');
            item.className = 'flex items-center justify-between p-3 bg-white/5 rounded-lg border border-white/5 hover:bg-white/10 transition-colors';

            const name = `Screen_Recording_${new Date().toLocaleTimeString().replace(/:/g, '-')}.webm`;

            item.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-red-500/20 rounded flex items-center justify-center text-red-400">
                        <i class="fas fa-video"></i>
                    </div>
                    <div class="flex flex-col">
                        <span class="text-sm font-bold text-slate-200">${name}</span>
                        <span class="text-xs text-slate-500">${(blob.size / 1024 / 1024).toFixed(2)} MB</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <a href="${url}" download="${name}" class="px-3 py-1.5 bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold rounded uppercase tracking-wider transition-colors">Download</a>
                    <button onclick="this.closest('div').remove()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold rounded uppercase transition-colors"><i class="fas fa-times"></i></button>
                </div>
            `;

            recordingsList.prepend(item);
            recordedChunks = [];

            recIndicator.style.opacity = '0';
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const diff = Date.now() - startTime;
                const secs = Math.floor((diff / 1000) % 60);
                const mins = Math.floor((diff / (1000 * 60)) % 60);
                timerEl.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerEl.textContent = "00:00";
        }
    </script>
</body>

</html>
