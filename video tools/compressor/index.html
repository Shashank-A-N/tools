<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Compressor (Backend Edition)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f2f5;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .whatsapp-green {
            background-color: #25D366;
        }

        #drop-zone.drag-over {
            background-color: #f0fff4;
            border-color: #25D366;
        }

        .loader {
            border-top-color: #25D366;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- ShadowTools Unified Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>

    <style id="shadow-toggle-light">
        .light-mode .theme-toggle-btn {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #f59e0b !important;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-4">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <div class="max-w-2xl w-full space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">
                Cloud <span class="text-[#25D366]">Compressor</span>
            </h1>
            <p class="text-gray-500 font-medium">High-speed server-side processing.</p>
        </div>

        <div class="glass-panel rounded-3xl p-8 space-y-8">
            <!-- Upload Section -->
            <div id="upload-section" class="space-y-4">
                <div id="drop-zone"
                    class="border-2 border-dashed border-gray-300 rounded-2xl p-12 text-center cursor-pointer hover:border-[#25D366] transition-all">
                    <input type="file" id="file-input" class="hidden" accept="video/*">
                    <div class="space-y-4">
                        <p class="text-lg font-semibold text-gray-700">Drop video to compress</p>
                        <button class="px-6 py-2 whatsapp-green text-white rounded-full font-bold">Choose File</button>
                    </div>
                </div>
            </div>

            <!-- Config Section -->
            <div id="config-section" class="hidden space-y-6">
                <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl">
                    <span id="file-name" class="font-bold truncate max-w-[250px]">video.mp4</span>
                    <button onclick="location.reload()" class="text-red-500 text-xs font-bold">CANCEL</button>
                </div>

                <div class="space-y-4">
                    <label class="block text-sm font-bold text-gray-700">QUALITY SETTING</label>
                    <input type="range" id="quality-slider" min="18" max="45" value="28"
                        class="w-full accent-[#25D366]">
                    <div class="flex justify-between text-[10px] font-bold text-gray-400">
                        <span>CRF 18 (HIGH)</span>
                        <span>CRF 28 (BALANCED)</span>
                        <span>CRF 45 (SMALLEST)</span>
                    </div>
                </div>

                <button id="start-btn" class="w-full py-4 whatsapp-green text-white rounded-2xl font-bold shadow-xl">
                    Compress for WhatsApp
                </button>
            </div>

            <!-- Processing Section -->
            <div id="processing-section" class="hidden text-center space-y-4 py-8">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mx-auto">
                </div>
                <p class="text-gray-600 font-medium">Server is processing your video...</p>
                <p class="text-xs text-gray-400">This may take a minute for large files.</p>
            </div>

            <!-- Success Section -->
            <div id="success-section" class="hidden text-center space-y-6">
                <div
                    class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold">Ready!</h2>
                <a id="download-link"
                    class="block w-full py-4 whatsapp-green text-white rounded-2xl font-bold text-center">Download
                    Now</a>
                <button onclick="location.reload()" class="text-gray-400 font-bold text-sm">New Compression</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://localhost:8000"; // Update this to your deployed server URL

        let selectedFile = null;
        const els = {
            drop: document.getElementById('drop-zone'),
            input: document.getElementById('file-input'),
            upSec: document.getElementById('upload-section'),
            cfgSec: document.getElementById('config-section'),
            procSec: document.getElementById('processing-section'),
            sucSec: document.getElementById('success-section'),
            name: document.getElementById('file-name'),
            start: document.getElementById('start-btn'),
            dl: document.getElementById('download-link'),
            quality: document.getElementById('quality-slider')
        };
        els.drop.onclick = () => els.input.click();
        els.input.onchange = (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                els.name.innerText = selectedFile.name;
                els.upSec.classList.add('hidden');
                els.cfgSec.classList.remove('hidden');
            }
        };
        els.start.onclick = async () => {
            els.cfgSec.classList.add('hidden');
            els.procSec.classList.remove('hidden');
            const formData = new FormData();
            formData.append('video', selectedFile);
            formData.append('crf', els.quality.value);
            try {
                const response = await fetch(`${API_URL}/compress`, {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) throw new Error('Compression failed');
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);

                els.dl.href = url;
                els.dl.download = `compressed_${selectedFile.name}`;

                els.procSec.classList.add('hidden');
                els.sucSec.classList.remove('hidden');
            } catch (err) {
                alert("Error: " + err.message);
                location.reload();
            }
        };
    </script>
</body>

</html>
