<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Video - Audio Swap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="../../styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif']
                    },
                    colors: {
                        cyber: {
                            primary: '#6366f1', // Indigo
                        }
                    }
                }
            }
        }
    </script>

    <!-- ShadowTools Unified Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>

    <style id="shadow-toggle-light">
        .light-mode .theme-toggle-btn {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #f59e0b !important;
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col font-sans overflow-x-hidden bg-slate-900 text-white selection:bg-indigo-500 selection:text-white">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <!-- 3D Background -->
    <div id="bg-3d-container"></div>

    <!-- Navigation -->
    <nav
        class="sticky top-0 z-50 glass-effect border-b border-white/5 px-4 md:px-6 py-3 flex items-center justify-between backdrop-blur-md">
        <a href="../index.html" class="flex items-center gap-3 text-slate-300 hover:text-white transition-colors group">
            <div
                class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center border border-white/10 group-hover:border-indigo-500/50 transition-all">
                <i class="fas fa-chevron-left text-xs group-hover:-translate-x-0.5 transition-transform"></i>
            </div>
            <span class="font-orbitron font-bold tracking-wider hidden md:block">BACK</span>
        </a>

        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-indigo-500/20 flex items-center justify-center text-indigo-500">
                <i class="fas fa-music"></i>
            </div>
            <h1 class="text-lg md:text-xl font-orbitron font-bold tracking-widest text-white">SHADOW<span
                    class="text-indigo-500">MIX</span></h1>
        </div>

        <div class="w-8"></div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-8 relative z-10 flex flex-col items-center gap-6">

        <!-- Upload -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl">
            <div id="videoUpload"
                class="h-64 glass rounded-3xl border-2 border-dashed border-white/10 hover:border-indigo-500/50 transition-all flex flex-col items-center justify-center cursor-pointer"
                onclick="document.getElementById('videoInput').click()">
                <input type="file" id="videoInput" accept="video/*" class="hidden"
                    onchange="handleVideo(this.files[0])">
                <i class="fas fa-film text-4xl text-indigo-400 mb-4"></i>
                <span class="font-orbitron">1. Select Video</span>
                <span id="vidName" class="text-xs text-slate-500 mt-2">No file selected</span>
            </div>

            <div id="audioUpload"
                class="h-64 glass rounded-3xl border-2 border-dashed border-white/10 hover:border-indigo-500/50 transition-all flex flex-col items-center justify-center cursor-pointer opacity-50 pointer-events-none"
                onclick="document.getElementById('audioInput').click()">
                <input type="file" id="audioInput" accept="audio/*" class="hidden"
                    onchange="handleAudio(this.files[0])">
                <i class="fas fa-music text-4xl text-indigo-400 mb-4"></i>
                <span class="font-orbitron">2. Select New Audio</span>
                <span id="audName" class="text-xs text-slate-500 mt-2">No file selected</span>
            </div>
        </div>

        <!-- Editor -->
        <div id="editorArea" class="w-full max-w-4xl hidden flex-col gap-6 animate-fade-in-up">

            <div class="bg-black/50 p-4 rounded-xl border border-white/10">
                <h3 class="text-center text-slate-400 mb-2 font-bold uppercase tracking-widest text-xs">Preview (Silent)
                </h3>
                <video id="preview" controls muted class="w-full max-h-[40vh] mx-auto"></video>
            </div>

            <button onclick="mergeMedia()" id="mergeBtn"
                class="px-10 py-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold font-orbitron tracking-wider rounded-xl shadow-lg transition-transform hover:-translate-y-1 mx-auto block">
                MERGE & DOWNLOAD
            </button>
        </div>

    </main>

    <script type="module" src="../../shared/bg-particles.js"></script>
    <script>
        const videoUpload = document.getElementById('videoUpload');
        const audioUpload = document.getElementById('audioUpload');
        const editorArea = document.getElementById('editorArea');
        const preview = document.getElementById('preview');

        let videoFile, audioFile;

        function handleVideo(file) {
            if (!file) return;
            videoFile = file;
            document.getElementById('vidName').textContent = file.name;
            videoUpload.classList.add('border-indigo-500');

            audioUpload.classList.remove('opacity-50', 'pointer-events-none');

            preview.src = URL.createObjectURL(file);
        }

        function handleAudio(file) {
            if (!file) return;
            audioFile = file;
            document.getElementById('audName').textContent = file.name;
            audioUpload.classList.add('border-indigo-500');

            editorArea.classList.remove('hidden');
            editorArea.classList.add('flex');
        }

        async function mergeMedia() {
            const btn = document.getElementById('mergeBtn');
            btn.disabled = true;
            btn.textContent = "PROCESSING...";

            // Use Web Audio API to mix? 
            // Or MediaStream composition? MediaStream is easier for export.

            // 1. Video Element source
            const vStream = preview.captureStream();
            const vTrack = vStream.getVideoTracks()[0];

            // 2. Audio Element source
            const audEl = new Audio();
            audEl.src = URL.createObjectURL(audioFile);

            // Need to wait for audio to be playable to capture stream?
            // Audio captureStream only works if played.

            // Sync playback strategy:
            // Play video and audio simultaneously, record them together.

            const context = new AudioContext();
            const dest = context.createMediaStreamDestination();
            const source = context.createMediaElementSource(audEl);
            source.connect(dest);
            // Don't connect to context.destination unless we want to hear it while processing (maybe yes?)
            // source.connect(context.destination);

            const mixedStream = new MediaStream([vTrack, dest.stream.getAudioTracks()[0]]);
            const recorder = new MediaRecorder(mixedStream, { mimeType: 'video/webm;codecs=vp9' });
            const chunks = [];

            recorder.ondataavailable = e => chunks.push(e.data);
            recorder.onstop = () => {
                const blob = new Blob(chunks, { type: 'video/webm' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'merged_video.webm';
                a.click();

                btn.disabled = false;
                btn.textContent = "MERGE & DOWNLOAD";
            };

            recorder.start();

            preview.currentTime = 0;
            audEl.currentTime = 0;

            // Mute video element effectively so we don't record original audio
            // (Wait, we only took video track from captureStream, so original audio is ignored automatically unless we add it)
            // Correct.

            preview.play();
            audEl.play();

            preview.onended = () => {
                recorder.stop();
                audEl.pause();
            };
        }
    </script>
</body>

</html>
