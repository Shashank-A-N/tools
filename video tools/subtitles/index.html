<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Subtitle Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for text areas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        textarea::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .loader {
            border-top-color: #3B82F6;
            -webkit-animation: spinner 1.5s linear infinite;
            animation: spinner 1.5s linear infinite;
        }

        @keyframes spinner {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>

    <!-- ShadowTools Unified Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>

    <style id="shadow-toggle-light">
        .light-mode .theme-toggle-btn {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #f59e0b !important;
        }
    </style>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen font-sans">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <div class="container mx-auto px-4 py-8 max-w-5xl">

        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold text-blue-500 mb-2">AutoSub AI</h1>
            <p class="text-gray-400">Upload a video to generate subtitles instantly using Whisper AI.</p>
        </header>

        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Left Column: Upload & Player -->
            <div class="space-y-6">

                <!-- Upload Zone -->
                <div id="drop-zone"
                    class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center bg-gray-800 hover:bg-gray-750 transition-colors cursor-pointer relative">
                    <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                        accept="video/*,audio/*">
                    <div class="pointer-events-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto text-gray-400 mb-3" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-lg font-medium text-white">Drop video here or click to upload</p>
                        <p class="text-sm text-gray-500 mt-1">MP4, MOV, MKV, AVI (Max 500MB)</p>
                    </div>
                </div>

                <!-- Processing State -->
                <div id="processing-state"
                    class="hidden bg-gray-800 rounded-xl p-6 text-center shadow-lg border border-gray-700">
                    <div
                        class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mx-auto mb-3">
                    </div>
                    <h3 class="text-lg font-semibold animate-pulse">Transcribing Audio...</h3>
                    <p class="text-gray-400 text-sm mt-1">This uses a large AI model, please wait.</p>
                </div>

                <!-- Video Player -->
                <div id="video-container"
                    class="hidden bg-black rounded-xl overflow-hidden shadow-2xl aspect-video relative group">
                    <video id="video-player" class="w-full h-full" controls playsinline>
                        Your browser does not support the video tag.
                    </video>
                </div>

            </div>

            <!-- Right Column: Results -->
            <div class="space-y-4 flex flex-col h-full">

                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-semibold flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-500" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                        </svg>
                        Generated Subtitles (.vtt)
                    </h2>
                    <button id="download-btn" disabled
                        class="px-4 py-2 bg-gray-700 text-gray-400 rounded-lg text-sm font-medium transition-colors hover:bg-gray-600 disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
                        Download VTT
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                    </button>
                </div>

                <div class="flex-grow relative">
                    <textarea id="subtitle-output" readonly
                        class="w-full h-96 lg:h-full bg-gray-800 border border-gray-700 rounded-xl p-4 text-gray-300 font-mono text-sm focus:outline-none focus:border-blue-500 transition-colors resize-none"
                        placeholder="Subtitles will appear here after processing..."></textarea>
                </div>
            </div>

        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const dropZone = document.getElementById('drop-zone');
        const processingState = document.getElementById('processing-state');
        const videoContainer = document.getElementById('video-container');
        const videoPlayer = document.getElementById('video-player');
        const subtitleOutput = document.getElementById('subtitle-output');
        const downloadBtn = document.getElementById('download-btn');

        // Drag and Drop Effects
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('border-blue-500', 'bg-gray-750');
        });
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('border-blue-500', 'bg-gray-750');
        });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-blue-500', 'bg-gray-750');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            // Reset UI
            videoContainer.classList.add('hidden');
            processingState.classList.remove('hidden');
            dropZone.classList.add('hidden');
            subtitleOutput.value = "Uploading and processing... This may take a minute based on video length.";
            downloadBtn.disabled = true;
            downloadBtn.classList.remove('bg-blue-600', 'text-white', 'hover:bg-blue-700');
            downloadBtn.classList.add('bg-gray-700', 'text-gray-400');

            // Setup local video preview immediately
            const fileURL = URL.createObjectURL(file);
            videoPlayer.src = fileURL;

            // Prepare Upload
            const formData = new FormData();
            formData.append('file', file);

            // Send to Backend
            fetch('/transcribe', {
                method: 'POST',
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    processingState.classList.add('hidden');
                    dropZone.classList.remove('hidden');

                    if (data.error) {
                        alert('Error: ' + data.error);
                        subtitleOutput.value = "Error occurred during transcription.";
                        return;
                    }

                    // Success
                    videoContainer.classList.remove('hidden');
                    subtitleOutput.value = data.vtt;

                    // Enable Download
                    downloadBtn.disabled = false;
                    downloadBtn.classList.remove('bg-gray-700', 'text-gray-400');
                    downloadBtn.classList.add('bg-blue-600', 'text-white', 'hover:bg-blue-700');

                    // Setup Download Click
                    downloadBtn.onclick = () => {
                        const blob = new Blob([data.vtt], { type: 'text/vtt' });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = 'subtitles.vtt';
                        a.click();
                        URL.revokeObjectURL(url);
                    };

                    // Add subtitles to video player
                    const trackBlob = new Blob([data.vtt], { type: "text/vtt" });
                    const trackUrl = URL.createObjectURL(trackBlob);

                    // Remove old tracks
                    const oldTracks = videoPlayer.getElementsByTagName('track');
                    while (oldTracks.length > 0) oldTracks[0].remove();

                    const track = document.createElement('track');
                    track.kind = "captions";
                    track.label = "English";
                    track.srclang = "en";
                    track.src = trackUrl;
                    track.default = true;
                    videoPlayer.appendChild(track);

                    // Auto play to show it works
                    videoPlayer.textTracks[0].mode = "showing";
                    videoPlayer.play();
                })
                .catch(err => {
                    console.error(err);
                    processingState.classList.add('hidden');
                    dropZone.classList.remove('hidden');
                    alert("An error occurred connecting to the server.");
                });
        }
    </script>
</body>

</html>
