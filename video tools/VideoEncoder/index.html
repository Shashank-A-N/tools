<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Encoder | Shadow Video</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif']
                    },
                    colors: {
                        cyber: { primary: '#f97316' } // Orange
                    }
                }
            }
        }
    </script>
    <style>
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .matrix-bg {
            background-image: linear-gradient(0deg, transparent 24%, rgba(249, 115, 22, .05) 25%, rgba(249, 115, 22, .05) 26%, transparent 27%, transparent 74%, rgba(249, 115, 22, .05) 75%, rgba(249, 115, 22, .05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(249, 115, 22, .05) 25%, rgba(249, 115, 22, .05) 26%, transparent 27%, transparent 74%, rgba(249, 115, 22, .05) 75%, rgba(249, 115, 22, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
        }
    </style>

    <!-- ShadowTools Unified Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>

    <style id="shadow-toggle-light">
        .light-mode .theme-toggle-btn {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #f59e0b !important;
        }
    </style>
</head>

<body
    class="bg-slate-950 text-white selection:bg-orange-500 selection:text-white min-h-screen overflow-hidden flex flex-col">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <!-- Navbar -->
    <nav class="glass-panel border-b border-white/5 py-3 px-6 flex justify-between items-center z-50">
        <div class="flex items-center gap-4">
            <a href="../index.html" class="text-slate-400 hover:text-white transition-colors">
                <i class="fas fa-chevron-left"></i>
            </a>
            <div class="flex items-center gap-3">
                <div
                    class="w-8 h-8 rounded bg-orange-500/10 flex items-center justify-center border border-orange-500/20">
                    <i class="fas fa-file-code text-orange-400"></i>
                </div>
                <h1 class="text-xl font-orbitron font-bold tracking-widest uppercase">Video<span
                        class="text-orange-500">Encoder</span></h1>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button id="btn-reset" class="text-slate-400 hover:text-white transition-colors mr-4">
                <i class="fas fa-trash-alt"></i> NEW PROJECT
            </button>
            <div class="text-xs font-mono text-orange-400/80 animate-pulse">SECURE TRANSCODE ACTIVE</div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <main class="flex-1 flex relative overflow-hidden">
        <div class="max-w-6xl mx-auto w-full relative z-10 p-6 pb-24">

            <!-- Upload State -->
            <div id="upload-state"
                class="border-2 border-dashed border-slate-700 rounded-3xl p-12 text-center hover:border-orange-500/50 transition-colors bg-slate-900/50 backdrop-blur-sm cursor-pointer"
                onclick="document.getElementById('file-input').click()">
                <input type="file" id="file-input" class="hidden" accept="video/*">
                <div id="dropzone" class="space-y-4">
                    <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-6">
                        <i class="fas fa-cloud-upload-alt text-3xl text-orange-500"></i>
                    </div>
                    <h3 class="text-2xl font-bold text-white">Drop Video Here</h3>
                    <p class="text-slate-500">Support for MP4, WebM, MOV</p>
                    <div
                        class="inline-block px-6 py-2 bg-slate-800 text-orange-400 rounded-full text-sm font-mono mt-4">
                        AUTO-DETECT FORMAT
                    </div>
                </div>
            </div>

            <!-- Preview & Settings State -->
            <div id="preview-state" class="hidden animate-fade-in-up">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                    <!-- Video Preview -->
                    <div class="lg:col-span-2 space-y-4">
                        <div
                            class="relative bg-black rounded-2xl overflow-hidden shadow-2xl aspect-video border border-white/10 group">
                            <video id="video-preview" class="w-full h-full object-contain" controls></video>
                        </div>class="absolute inset-0 bg-black/90 z-20 hidden flex flex-col items-center
                        justify-center">
                        <div class="w-64 h-2 bg-slate-800 rounded-full overflow-hidden mb-4 relative">
                            <div id="progress-bar"
                                class="absolute inset-y-0 left-0 bg-orange-500 w-0 transition-all duration-300"></div>
                        </div>
                        <div class="font-mono text-orange-400 text-sm animate-pulse">TRANSCODING STREAM... <span
                                id="progress-text">0%</span></div>
                        <div class="mt-8 grid grid-cols-4 gap-1 opacity-50" id="hex-grid"></div>
                    </div>
                </div>
            </div>

            <!-- Sidebar Controls -->
            <aside class="w-80 glass-panel border-l border-white/5 flex flex-col z-10">
                <div class="p-4 border-b border-white/5 bg-slate-900/50">
                    <h2 class="text-sm font-orbitron text-slate-300 uppercase tracking-wider"><i
                            class="fas fa-sliders-h mr-2 text-orange-500"></i> Parameters</h2>
                </div>

                <div class="p-4 space-y-6 flex-1 overflow-y-auto">
                    <!-- Encoding Profile -->
                    <div class="space-y-2">
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-wider">Target Format</label>
                        <div class="grid grid-cols-2 gap-2">
                            <button
                                class="format-btn active px-3 py-2 bg-orange-500/20 border border-orange-500 text-orange-400 rounded text-xs font-mono font-bold"
                                data-format="webm">WEBM (VP9)</button>
                            <button
                                class="format-btn px-3 py-2 bg-slate-800 border border-transparent text-slate-400 rounded text-xs font-mono hover:bg-slate-700"
                                data-format="mp4">MP4 (H.264)</button>
                        </div>
                    </div>

                    <!-- Quality/Bitrate -->
                    <div class="space-y-2">
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-wider flex justify-between">
                            <span>Quality (Bitrate)</span>
                            <span id="bitrate-val" class="text-orange-400">High</span>
                        </label>
                        <input type="range" id="bitrate-slider" min="1" max="3" step="1" value="3"
                            class="w-full accent-orange-500 h-1 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        <div class="flex justify-between text-[10px] text-slate-600 font-mono">
                            <span>LOW</span>
                            <span>MED</span>
                            <span>HIGH</span>
                        </div>
                    </div>

                    <!-- Security Options -->
                    <div class="space-y-4 pt-4 border-t border-white/5">
                        <label class="text-xs text-slate-500 font-bold uppercase tracking-wider block mb-2">Security
                            Protocols</label>

                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div
                                class="w-4 h-4 rounded border border-slate-600 flex items-center justify-center group-hover:border-orange-500 transition-colors">
                                <i class="fas fa-check text-[10px] text-orange-500 opacity-100"></i>
                            </div>
                            <span class="text-sm text-slate-300 group-hover:text-white">Strip Metadata (Exif)</span>
                        </label>

                        <label class="flex items-center gap-3 cursor-pointer group">
                            <div
                                class="w-4 h-4 rounded border border-slate-600 flex items-center justify-center group-hover:border-orange-500 transition-colors">
                                <i
                                    class="fas fa-check text-[10px] text-orange-500 opacity-0 group-hover:opacity-50"></i>
                            </div>
                            <span class="text-sm text-slate-300 group-hover:text-white">Remove Audio Track</span>
                        </label>
                    </div>
                </div>

                <div class="p-4 border-t border-white/5 bg-slate-900/50">
                    <button id="btn-process" disabled
                        class="w-full py-3 bg-slate-800 text-slate-500 font-orbitron font-bold tracking-widest rounded transition-all disabled:cursor-not-allowed hover:bg-orange-600 hover:text-white hover:shadow-[0_0_20px_-5px_rgba(249,115,22,0.5)]">
                        INITIATE ENCODE
                    </button>
                </div>
            </aside>

        </div> <!-- Close inner container -->
    </main>

    <script type="module" src="../../shared/bg-particles.js"></script>
    <script type="module" src="./js/App.js"></script>
</body>

</html>
