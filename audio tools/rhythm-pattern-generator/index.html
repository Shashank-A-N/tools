<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S H A D O W // S E Q U E N C E R</title>

    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Local Styles -->
    <link rel="stylesheet" href="../../styles.css"> <!-- Global -->
    <link rel="stylesheet" href="css/style.css"> <!-- Module Specific -->
    <!-- Shared Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <link rel="stylesheet" href="../shared/audio-tool-theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>
</head>

<body class="bg-[#050510] text-white h-screen flex flex-col overflow-hidden">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <!-- Navbar -->
    <nav class="h-16 border-b border-white/5 flex items-center justify-between px-6 bg-black/40 backdrop-blur-md z-50">
        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-purple-600/20 flex items-center justify-center border border-purple-500/50">
                <i class="fas fa-wave-square text-purple-400"></i>
            </div>
            <div class="hidden md:block">
                <h1 class="text-xl font-orbitron tracking-widest leading-none">SHADOW<span
                        class="text-purple-500">SEQ</span></h1>
                <div class="text-[10px] text-slate-500 font-mono tracking-[0.3em]">ADVANCED RHYTHM ENGINE</div>
            </div>
        </div>

        <div class="flex items-center gap-6">
            <!-- Transport -->
            <div class="flex items-center bg-slate-900/50 rounded-lg p-1 border border-white/5">
                <button id="stop-btn"
                    class="w-10 h-8 hover:bg-slate-700/50 rounded transition-colors text-slate-400 hover:text-white">
                    <i class="fas fa-stop"></i>
                </button>
                <div class="w-px h-4 bg-white/10 mx-1"></div>
                <button id="play-btn"
                    class="w-12 h-8 bg-amber-600 hover:bg-amber-500 rounded text-white shadow-[0_0_15px_rgba(245,158,11,0.3)] transition-all">
                    <i class="fas fa-play"></i>
                </button>
            </div>

            <!-- Tempo -->
            <div class="flex flex-col items-center">
                <span class="text-[10px] text-slate-500 font-bold">BPM</span>
                <input type="number" id="bpm-input" value="120"
                    class="bg-transparent w-12 text-center font-mono font-bold text-lg text-amber-500 focus:outline-none border-b border-transparent focus:border-amber-500/50">
            </div>

            
        <a href="../index.html"
                class="w-8 h-8 flex items-center justify-center hover:bg-white/5 rounded-full transition-colors text-slate-400 hover:text-white">
                <i class="fas fa-times"></i>
            </a>
        </div>
    </nav>

    <!-- Main Layout -->
    <main class="flex-1 flex flex-col lg:flex-row gap-4 p-4 overflow-hidden relative">

        <!-- Left Panel: Sequencer & Visuals -->
        <div class="flex-[3] flex flex-col gap-4 min-w-0 h-full lg:h-auto overflow-y-auto lg:overflow-visible">

            <!-- Visualizer Area -->
            <div class="h-48 glass-panel rounded-xl p-4 relative overflow-hidden group shrink-0 order-2 lg:order-none">
                <div class="absolute top-2 left-4 text-xs font-mono text-slate-500 z-10">FREQUENCY SPECTRUM</div>
                <canvas id="visualizer" class="opacity-80 group-hover:opacity-100 transition-opacity"></canvas>
            </div>

            <!-- Sequencer Grid -->
            <div
                class="flex-1 glass-panel rounded-xl p-6 overflow-y-auto overflow-x-auto min-h-[300px] order-1 lg:order-none">
                <div class="flex justify-between items-center mb-4 sticky left-0">
                    <h2 class="font-orbitron text-slate-300 tracking-wider text-sm"><i
                            class="fas fa-th mr-2 text-purple-500"></i>PATTERN GRID</h2>
                    <div class="flex gap-2">
                        <button id="load-pattern-btn"
                            class="text-xs px-3 py-1 bg-slate-800 rounded hover:bg-slate-700 transition"
                            title="Load Pattern"><i class="fas fa-folder-open md:mr-1"></i> <span
                                class="hidden md:inline">LOAD</span></button>
                        <button id="save-pattern-btn"
                            class="text-xs px-3 py-1 bg-slate-800 rounded hover:bg-slate-700 transition"
                            title="Save Pattern"><i class="fas fa-save md:mr-1"></i> <span
                                class="hidden md:inline">SAVE</span></button>
                        <button class="text-xs px-3 py-1 bg-slate-800 rounded hover:bg-slate-700 transition"
                            onclick="document.dispatchEvent(new Event('export-wav'))" title="Export WAV"><i
                                class="fas fa-file-export md:mr-1"></i> <span
                                class="hidden md:inline">WAV</span></button>
                        <div class="w-px h-6 bg-white/10 mx-1"></div>
                        <button class="text-xs px-3 py-1 bg-slate-800 rounded hover:bg-slate-700 transition"
                            onclick="document.dispatchEvent(new Event('randomize'))" title="Randomize"><i
                                class="fas fa-random md:mr-1"></i>
                            <span class="hidden md:inline">RAND</span></button>
                    </div>
                </div>

                <div id="sequencer-grid" class="w-full">
                    <!-- Grid injected by JS -->
                </div>
            </div>
        </div>

        <!-- Right Panel: Controls & Mixer -->
        <div class="flex-1 min-w-[250px] flex flex-col gap-4">

            <!-- Synth Params -->
            <div class="flex-1 glass-panel rounded-xl p-5 overflow-y-auto">
                <div class="flex items-center justify-between mb-4 border-b border-white/5 pb-2">
                    <h2 class="font-orbitron text-slate-300 tracking-wider text-sm"><i
                            class="fas fa-sliders-h mr-2 text-amber-500"></i>SYNTH</h2>
                    <div class="text-[10px] text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded">SELECTED</div>
                </div>
                <div id="synth-controls">
                    <!-- Controls injected by JS -->
                    <div class="text-center text-slate-500 text-sm mt-10">Select an instrument track to edit parameters
                    </div>
                </div>
            </div>

            <!-- Mixer -->
            <div class="h-48 glass-panel rounded-xl p-4 overflow-x-auto">
                <div class="text-[10px] text-slate-500 font-mono mb-2 text-center">MIXER CONSOLE</div>
                <div id="mixer-controls" class="flex justify-center gap-2 h-full pb-2">
                    <!-- Mixer Strips injected by JS -->
                </div>
            </div>
        </div>
    </main>

    <!-- Logic -->
    <script type="module" src="js/app.js"></script>
</body>

</html>
