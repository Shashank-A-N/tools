<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome - AudioForge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#05050a',
                            panel: 'rgba(21, 21, 30, 0.6)',
                            primary: '#06b6d4',
                            secondary: '#d946ef',
                            text: '#e2e8f0',
                            muted: '#64748b'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'neon': '0 0 10px rgba(6, 182, 212, 0.5)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #05050a 100%);
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dot {
            transition: all 0.1s;
        }

        .dot.active {
            background: #d946ef;
            box-shadow: 0 0 15px #d946ef;
            transform: scale(1.2);
        }
    </style>
    <!-- Shared Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <link rel="stylesheet" href="../shared/audio-tool-theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>
</head>

<body class="min-h-screen flex flex-col font-sans overflow-hidden">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <header class="h-16 glass z-50 flex items-center justify-between px-6 border-b border-white/5 shrink-0">
        <div class="flex items-center gap-3">
            <div
                class="w-8 h-8 rounded bg-gradient-to-br from-cyber-primary to-cyber-secondary flex items-center justify-center">
                <i class="fas fa-clock text-white text-sm"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">AudioForge <span
                    class="text-cyber-primary font-light">Metronome</span></h1>
        </div>
        
        <a href="../index.html" class="text-xs text-cyber-muted hover:text-white transition-colors">
            <i class="fas fa-arrow-left mr-1"></i> Back to Tools
        </a>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="glass w-full max-w-lg rounded-2xl p-8 flex flex-col gap-8 shadow-2xl items-center">

            <div class="w-full flex justify-between items-center bg-black/30 p-4 rounded-xl border border-white/5">
                <button
                    class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-cyber-primary text-xl transition"
                    onclick="changeBpm(-1)">
                    <i class="fas fa-minus"></i>
                </button>

                <div class="text-center">
                    <div class="text-8xl font-mono font-bold text-white tracking-tighter leading-none" id="bpm-display">
                        120</div>
                    <div class="text-cyber-muted text-sm uppercase tracking-widest mt-1">BPM</div>
                </div>

                <button
                    class="w-12 h-12 rounded-full bg-white/5 hover:bg-white/10 flex items-center justify-center text-cyber-primary text-xl transition"
                    onclick="changeBpm(1)">
                    <i class="fas fa-plus"></i>
                </button>
            </div>

            <input type="range" min="40" max="220" value="120" id="bpm-slider"
                class="w-full accent-cyber-primary h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer">

            <div class="flex gap-4">
                <div class="dot w-4 h-4 rounded-full bg-gray-600"></div>
                <div class="dot w-4 h-4 rounded-full bg-gray-600"></div>
                <div class="dot w-4 h-4 rounded-full bg-gray-600"></div>
                <div class="dot w-4 h-4 rounded-full bg-gray-600"></div>
            </div>

            <button id="toggle-btn"
                class="w-full py-5 rounded-xl bg-cyber-primary text-black font-bold text-xl hover:bg-cyan-400 transition-all shadow-neon flex items-center justify-center gap-3">
                <i class="fas fa-play"></i> Start
            </button>
        </div>
    </main>

    <script>
        let audioCtx;
        let isPlaying = false;
        let bpm = 120;
        let nextNoteTime = 0.0;
        let timerID = null;
        let lookahead = 25.0;
        let scheduleAheadTime = 0.1;
        let currentNote = 0;
        const notesInQueue = [];

        const bpmDisplay = document.getElementById('bpm-display');
        const bpmSlider = document.getElementById('bpm-slider');
        const toggleBtn = document.getElementById('toggle-btn');
        const dots = document.querySelectorAll('.dot');

        bpmSlider.addEventListener('input', (e) => {
            bpm = parseInt(e.target.value);
            bpmDisplay.textContent = bpm;
        });

        function changeBpm(amount) {
            bpm += amount;
            if (bpm < 40) bpm = 40;
            if (bpm > 220) bpm = 220;
            bpmDisplay.textContent = bpm;
            bpmSlider.value = bpm;
        }

        toggleBtn.addEventListener('click', () => {
            if (isPlaying) stopMetronome();
            else startMetronome();
        });

        function nextNote() {
            const secondsPerBeat = 60.0 / bpm;
            nextNoteTime += secondsPerBeat;
            currentNote++;
            if (currentNote === 4) currentNote = 0;
        }

        function scheduleNote(beatNumber, time) {
            // Push to queue for viz
            notesInQueue.push({ note: beatNumber, time: time });

            // Create oscillator
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (beatNumber === 0) {
                osc.frequency.value = 880.0; // High click for beat 1
            } else {
                osc.frequency.value = 440.0; // Low click
            }

            osc.start(time);
            osc.stop(time + 0.05);

            // Envelope
            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.05);
        }

        function scheduler() {
            while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
                scheduleNote(currentNote, nextNoteTime);
                nextNote();
            }
            timerID = window.setTimeout(scheduler, lookahead);
        }

        function startMetronome() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            currentNote = 0;
            nextNoteTime = audioCtx.currentTime + 0.05;
            isPlaying = true;
            scheduler();

            // UI
            toggleBtn.innerHTML = '<i class="fas fa-stop"></i> Stop';
            toggleBtn.classList.replace('bg-cyber-primary', 'bg-red-500');
            toggleBtn.classList.replace('hover:bg-cyan-400', 'hover:bg-red-600');
            toggleBtn.classList.remove('shadow-neon');

            drawViz();
        }

        function stopMetronome() {
            isPlaying = false;
            window.clearTimeout(timerID);

            toggleBtn.innerHTML = '<i class="fas fa-play"></i> Start';
            toggleBtn.classList.replace('bg-red-500', 'bg-cyber-primary');
            toggleBtn.classList.replace('hover:bg-red-600', 'hover:bg-cyan-400');
            toggleBtn.classList.add('shadow-neon');

            dots.forEach(d => d.classList.remove('active'));
        }

        function drawViz() {
            if (!isPlaying) return;

            const drawNote = () => {
                const currentTime = audioCtx.currentTime;

                while (notesInQueue.length && notesInQueue[0].time < currentTime) {
                    const current = notesInQueue[0];
                    notesInQueue.splice(0, 1);

                    // Light up dot
                    dots.forEach(d => d.classList.remove('active'));
                    dots[current.note].classList.add('active');
                }

                if (isPlaying) requestAnimationFrame(drawNote);
            };
            drawNote();
        }

    </script>
</body>

</html>
