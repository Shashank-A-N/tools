<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Text - Lorem Ipsum</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="../../styles.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['Courier New', 'monospace'],
                        sans: ['Rajdhani', 'sans-serif'],
                        orbitron: ['Orbitron', 'sans-serif']
                    },
                    colors: {
                        cyber: {
                            accent: '#94a3b8', // Gray-400
                        }
                    }
                }
            }
        }
    </script>

    <!-- ShadowTools Unified Theme System -->
    <link rel="stylesheet" href="../../shared/theme.css">
    <script src="../../shared/theme.js"></script>

    <!-- ShadowTools Auth System -->
    <link rel="stylesheet" href="../../shared/auth.css">
    <script src="../../shared/auth.js" defer></script>

    <!-- ShadowTools Light Mode Text Fix -->
    <style id="shadow-light-fix">
        /* Prevent invisible white text in light mode */
        .light-mode h1, .light-mode h2, .light-mode h3, .light-mode h4, .light-mode h5, .light-mode h6 {
            color: #0f172a;
        }
        .light-mode p, .light-mode span, .light-mode label, .light-mode li, .light-mode td, .light-mode th {
            color: #334155;
        }
        .light-mode .text-white { color: #0f172a !important; }
        .light-mode .text-gray-100, .light-mode .text-gray-200, .light-mode .text-gray-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-100, .light-mode .text-slate-200, .light-mode .text-slate-300 {
            color: #334155 !important;
        }
        .light-mode .text-slate-400 { color: #64748b !important; }
        .light-mode .text-slate-500 { color: #64748b !important; }

        /* Background fixes */
        .light-mode body {
            background-color: #f8fafc !important;
            color: #0f172a !important;
        }
        .light-mode .bg-gray-900, .light-mode .bg-slate-900 {
            background-color: #f1f5f9 !important;
        }
        .light-mode .bg-gray-800, .light-mode .bg-slate-800 {
            background-color: #e2e8f0 !important;
        }
        .light-mode .bg-gray-950, .light-mode .bg-slate-950 {
            background-color: #f8fafc !important;
        }
        .light-mode .bg-black { background-color: #f8fafc !important; }
        .light-mode .bg-black\/20, .light-mode .bg-black\/40, .light-mode .bg-black\/50 {
            background-color: rgba(0,0,0,0.04) !important;
        }

        /* Border fixes */
        .light-mode .border-white\/5, .light-mode .border-white\/10 {
            border-color: rgba(0,0,0,0.08) !important;
        }
        .light-mode .border-slate-700, .light-mode .border-slate-600, .light-mode .border-gray-700 {
            border-color: #e2e8f0 !important;
        }

        /* Glass effect fix */
        .light-mode .glass, .light-mode .glass-effect {
            background: rgba(255,255,255,0.85) !important;
            border-color: rgba(0,0,0,0.08) !important;
        }

        /* Input fixes */
        .light-mode input, .light-mode textarea, .light-mode select {
            color: #0f172a;
            background-color: #fff;
            border-color: #cbd5e1;
        }
        .light-mode input::placeholder, .light-mode textarea::placeholder {
            color: #94a3b8;
        }

        /* Button text fix */
        .light-mode button { color: inherit; }

        /* Code / mono text */
        .light-mode code, .light-mode pre, .light-mode .font-mono {
            color: #334155;
        }

        /* Accent colors stay vivid */
        .light-mode .text-blue-400, .light-mode .text-blue-500 { color: #2563eb !important; }
        .light-mode .text-purple-400, .light-mode .text-purple-500 { color: #7c3aed !important; }
        .light-mode .text-green-400, .light-mode .text-green-500 { color: #16a34a !important; }
        .light-mode .text-red-400, .light-mode .text-red-500 { color: #dc2626 !important; }
        .light-mode .text-yellow-400, .light-mode .text-amber-400 { color: #d97706 !important; }
        .light-mode .text-cyan-400 { color: #0891b2 !important; }
        .light-mode .text-pink-400, .light-mode .text-pink-500 { color: #db2777 !important; }
        .light-mode .text-orange-400 { color: #ea580c !important; }

        /* Shadow/glow reduction */
        .light-mode [class*="shadow-"] { 
            --tw-shadow-color: rgba(0,0,0,0.06);
        }

        /* Nav bar in light mode */
        .light-mode nav, .light-mode header {
            background: rgba(248,250,252,0.9) !important;
            border-color: rgba(0,0,0,0.06) !important;
        }
        .light-mode nav a, .light-mode header a { color: #334155; }
        .light-mode nav a:hover, .light-mode header a:hover { color: #0f172a; }

        /* Footer */
        .light-mode footer {
            background-color: #f1f5f9 !important;
            border-color: rgba(0,0,0,0.06) !important;
            color: #475569 !important;
        }

        /* Canvas/3D dimming */
        .light-mode canvas { opacity: 0.15; }
        .light-mode #bg-3d-container { opacity: 0.1 !important; }
        .light-mode .noise-overlay { opacity: 0 !important; }
    </style>

    <style id="shadow-toggle-light">
        .light-mode .theme-toggle-btn {
            background: rgba(0,0,0,0.05) !important;
            border-color: rgba(0,0,0,0.1) !important;
            color: #f59e0b !important;
        }
    </style>
</head>

<body
    class="min-h-screen flex flex-col font-sans overflow-x-hidden bg-slate-900 text-white selection:bg-slate-500 selection:text-white">
    <button onclick="toggleTheme()" class="theme-toggle-btn" style="position:fixed;top:12px;right:12px;z-index:9999;width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.12);color:#94a3b8;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1rem;transition:all .3s;backdrop-filter:blur(8px);" title="Toggle Theme" aria-label="Toggle Theme"><i id="theme-icon" class="fas fa-moon"></i></button>
    <!-- ShadowTools Auth Widget -->
    <div id="shadow-auth-ui" style="position:fixed;top:12px;right:60px;z-index:9998;"></div>

    <!-- 3D Background -->
    <div id="bg-3d-container"></div>

    <!-- Navigation -->
    <nav
        class="sticky top-0 z-50 glass-effect border-b border-white/5 px-4 md:px-6 py-3 flex items-center justify-between backdrop-blur-md">
        <a href="../index.html" class="flex items-center gap-3 text-slate-300 hover:text-white transition-colors group">
            <div
                class="w-8 h-8 rounded-lg bg-white/5 flex items-center justify-center border border-white/10 group-hover:border-slate-500/50 transition-all">
                <i class="fas fa-chevron-left text-xs group-hover:-translate-x-0.5 transition-transform"></i>
            </div>
            <span class="font-orbitron font-bold tracking-wider hidden md:block">BACK</span>
        </a>

        <div class="flex items-center gap-3">
            <div class="w-8 h-8 rounded bg-slate-500/20 flex items-center justify-center text-slate-400">
                <i class="fas fa-paragraph"></i>
            </div>
            <h1 class="text-lg md:text-xl font-orbitron font-bold tracking-widest text-white">SHADOW<span
                    class="text-slate-400">IPSUM</span></h1>
        </div>

        <div class="w-8"></div>
    </nav>

    <!-- Main Content -->
    <main
        class="flex-grow container mx-auto px-4 py-8 relative z-10 flex flex-col gap-6 h-[calc(100vh-80px)] min-h-[600px]">

        <!-- Controls Bar -->
        <div
            class="glass p-5 rounded-xl border border-white/5 flex flex-wrap md:flex-nowrap gap-6 items-center shadow-lg bg-slate-900/60 sticky top-0 z-10 justify-center">

            <div
                class="flex items-center gap-3 bg-slate-950/50 px-4 py-2 rounded-lg border border-white/10 w-full md:w-auto">
                <label
                    class="text-xs font-bold text-slate-400 uppercase tracking-widest whitespace-nowrap">Count:</label>
                <input type="number" id="count" value="5" min="1" max="100"
                    class="bg-transparent w-16 text-center focus:outline-none font-orbitron text-slate-200 border-b border-white/20 focus:border-slate-500">
            </div>

            <div
                class="flex items-center gap-3 bg-slate-950/50 px-4 py-2 rounded-lg border border-white/10 w-full md:w-auto">
                <label
                    class="text-xs font-bold text-slate-400 uppercase tracking-widest whitespace-nowrap">Type:</label>
                <select id="type"
                    class="bg-transparent focus:outline-none text-slate-200 text-sm font-sans cursor-pointer w-full">
                    <option value="paragraphs" class="bg-black">Paragraphs</option>
                    <option value="sentences" class="bg-black">Sentences</option>
                    <option value="words" class="bg-black">Words</option>
                </select>
            </div>

            <button onclick="generate()"
                class="w-full md:w-auto px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white rounded-lg shadow-lg transition-all flex items-center justify-center gap-2 font-bold uppercase tracking-wider group">
                <i class="fas fa-sync-alt group-hover:rotate-180 transition-transform duration-500"></i> Generate
            </button>
        </div>

        <!-- Output Panel -->
        <div class="flex flex-col glass rounded-2xl border border-white/5 shadow-xl overflow-hidden h-full flex-grow">
            <div
                class="px-6 py-4 border-b border-white/5 bg-slate-900/50 flex justify-between items-center bg-slate-800/20">
                <span class="text-xs font-bold text-slate-400 tracking-widest uppercase"><i
                        class="fas fa-file-alt mr-2"></i>Generated Text</span>
                <button onclick="copy('textOutput')"
                    class="text-[10px] text-slate-400 hover:text-white transition-colors uppercase font-bold tracking-wider"><i
                        class="fas fa-copy mr-1"></i>Copy</button>
            </div>
            <textarea id="textOutput" readonly
                class="flex-1 w-full bg-slate-950/30 p-6 text-sm md:text-base lg:text-lg font-serif text-slate-300 focus:outline-none resize-none custom-scrollbar leading-relaxed"
                placeholder="Lorem ipsum dolor sit amet..."></textarea>
        </div>

    </main>

    <!-- Shared Script -->
    <script type="module" src="../../shared/bg-particles.js"></script>

    <script>
        const ipsum = [
            "lorem", "ipsum", "dolor", "sit", "amet", "consectetur", "adipiscing", "elit", "sed", "do", "eiusmod", "tempor", "incididunt", "ut", "labore", "et", "dolore", "magna", "aliqua", "ut", "enim", "ad", "minim", "veniam", "quis", "nostrud", "exercitation", "ullamco", "laboris", "nisi", "ut", "aliquip", "ex", "ea", "commodo", "consequat", "duis", "aute", "irure", "dolor", "in", "reprehenderit", "in", "voluptate", "velit", "esse", "cillum", "dolore", "eu", "fugiat", "nulla", "pariatur", "excepteur", "sint", "occaecat", "cupidatat", "non", "proident", "sunt", "in", "culpa", "qui", "officia", "deserunt", "mollit", "anim", "id", "est", "laborum"
        ];

        function generate() {
            const count = parseInt(document.getElementById('count').value) || 5;
            const type = document.getElementById('type').value;
            let output = '';

            if (type === 'words') {
                for (let i = 0; i < count; i++) {
                    output += ipsum[Math.floor(Math.random() * ipsum.length)] + ' ';
                }
            } else if (type === 'sentences') {
                for (let i = 0; i < count; i++) {
                    let sentence = '';
                    const len = Math.floor(Math.random() * 10) + 5;
                    for (let j = 0; j < len; j++) {
                        sentence += ipsum[Math.floor(Math.random() * ipsum.length)] + ' ';
                    }
                    output += sentence.charAt(0).toUpperCase() + sentence.slice(1).trim() + '. ';
                }
            } else {
                for (let i = 0; i < count; i++) {
                    let para = '';
                    const sentences = Math.floor(Math.random() * 5) + 3;
                    for (let s = 0; s < sentences; s++) {
                        let sentence = '';
                        const len = Math.floor(Math.random() * 10) + 5;
                        for (let j = 0; j < len; j++) {
                            sentence += ipsum[Math.floor(Math.random() * ipsum.length)] + ' ';
                        }
                        para += sentence.charAt(0).toUpperCase() + sentence.slice(1).trim() + '. ';
                    }
                    output += para.trim() + '\n\n';
                }
            }

            document.getElementById('textOutput').value = output.trim();
        }

        function copy(id) {
            const el = document.getElementById(id);
            el.select();
            document.execCommand('copy');
            const btn = document.querySelector(`button[onclick="copy('${id}')"]`);
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check mr-1"></i>COPIED';
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 1500);
        }

        // Initial
        window.addEventListener('load', generate);
    </script>
</body>

</html>
